[project]
name = "unified-trading-execution"
version = "0.1.0"
description = "Unified Trading Execution — core library (platform-agnostic types, dispatch, risk checks, state mirror)"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Syed Qaisar Jalil"},
]
dependencies = [
    "aiosqlite>=0.20",
    "uuid7>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
