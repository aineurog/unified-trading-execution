[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-trading-execution"
version = "0.0.2"
description = "A modular, plug-and-play order execution library for Python with adapters for Binance, Bybit, cTrader, Hyperliquid, Interactive Brokers and MetaTrader 5"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Syed Qaisar Jalil"},
]
dependencies = [
    "aiosqlite>=0.20",
    "uuid7>=0.1",  # uuid.uuid7() backport for Python 3.11–3.13 (stdlib in 3.14+)
]

[project.optional-dependencies]
binance = [
    "python-binance==1.0.37",
    "aiohttp>=3.9,<4.0",
]
bybit = [
    "pybit>=5.0.0",
    "requests>=2.0",
]
ctrader = []
hyperliquid = [
    "hyperliquid-python-sdk==0.24.0",
    "requests>=2.31,<3.0",
    "websocket-client>=1.5.1,<2.0",
]
ibkr = [
    "ib-async>=2.1.0",
]
metatrader = [
    "MetaTrader5>=5.0.0; sys_platform == 'win32'",
]
all = [
    "python-binance==1.0.37",
    "aiohttp>=3.9,<4.0",
    "pybit>=5.0.0",
    "requests>=2.31,<3.0",
    "hyperliquid-python-sdk==0.24.0",
    "websocket-client>=1.5.1,<2.0",
    "ib-async>=2.1.0",
    "MetaTrader5>=5.0.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unified_trading_execution = ["py.typed"]
