[project]
name = "unified-trading-execution-bybit"
version = "0.0.1"
description = "Unified Trading Execution — Bybit adapter"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Syed Qaisar Jalil"},
]
dependencies = [
    "unified-trading-execution>=0.0.1",
    "pybit>=5.0.0",
    "requests>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["src"]
