[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-trading-execution-bybit"
version = "0.0.2"
description = "Development harness for the Bybit adapter shipped in unified-trading-execution"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Syed Qaisar Jalil"},
]
dependencies = [
    "unified-trading-execution>=0.0.2",
    "pybit>=5.0.0",
    "requests>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.setuptools]
packages = []
