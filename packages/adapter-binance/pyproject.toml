[project]
name = "unified-trading-execution-binance"
version = "0.1.0"
description = "Unified Trading Execution — Binance adapter"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Syed Qaisar Jalil"},
]
dependencies = [
    "unified-trading-execution",
    "python-binance==1.0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
