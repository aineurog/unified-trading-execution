[project]
name = "unified-trading-execution-workspace"
version = "0.1.0"
description = "A modular, plug-and-play order execution library for Python"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Syed Qaisar Jalil"},
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
unified-trading-execution = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pre-commit>=3.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["unified_trading_execution"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = [
    "unified_trading_execution.bybit.*",
    "unified_trading_execution.ctrader.*",
    "uuid_extensions",
    "pybit.*",
    "MetaTrader5",
    "ib_async.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
addopts = ["-v", "--tb=short"]

[tool.importlinter]
root_package = "unified_trading_execution"

[[tool.importlinter.contracts]]
id = "core-never-imports-adapters"
name = "Core must never import adapter code"
type = "forbidden"
source_modules = ["unified_trading_execution"]
forbidden_modules = [
    "unified_trading_execution.bybit",
    "unified_trading_execution.ctrader",
    "unified_trading_execution.mt5",
    "unified_trading_execution.ibkr",
]

[[tool.importlinter.contracts]]
id = "adapters-never-import-each-other"
name = "Adapters must never import each other"
type = "forbidden"
source_modules = ["unified_trading_execution.bybit"]
forbidden_modules = [
    "unified_trading_execution.ctrader",
    "unified_trading_execution.mt5",
    "unified_trading_execution.ibkr",
]

[[tool.importlinter.contracts]]
id = "adapters-only-import-core"
name = "Adapters may only import from core and stdlib/third-party"
type = "independence"
modules = [
    "unified_trading_execution.bybit",
    "unified_trading_execution.ctrader",
    "unified_trading_execution.mt5",
    "unified_trading_execution.ibkr",
]
